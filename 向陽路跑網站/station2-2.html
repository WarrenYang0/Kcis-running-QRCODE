<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站點 2-2 — 向陽路跑</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem 1.75rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }
    .badge-green { background: #E1F5EE; color: #085041; }
    .badge-blue { background: #E6F1FB; color: #0C447C; }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.2s;
      margin-bottom: 1.25rem;
    }
    input:focus { outline: none; border-color: #1D9E75; background: white; }
    .info-box {
      background: #FFF8EC;
      border-left: 4px solid #F5A623;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.7;
      color: #5a3e00;
      margin-bottom: 1.5rem;
    }
    textarea {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafafa;
      resize: none;
      min-height: 140px;
      line-height: 1.6;
      transition: border-color 0.2s;
      margin-bottom: 0.5rem;
    }
    textarea:focus { outline: none; border-color: #1D9E75; background: white; }
    .char-count {
      font-size: 12px;
      color: #aaa;
      text-align: right;
      margin-bottom: 1.25rem;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: default; }
    .success {
      display: none;
      text-align: center;
      padding: 1rem 0;
    }
    .success-icon { font-size: 48px; margin-bottom: 1rem; }
    .success h2 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }
    .success p { font-size: 14px; color: #777; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">

    <div id="name-view">
      <span class="badge badge-green">站點 2-2</span>
      <h1>先輸入你的姓名再開始！</h1>
      <label for="name">你的姓名</label>
      <input type="text" id="name" placeholder="輸入報名姓名" maxlength="30">
      <button id="start-btn" disabled>開始 →</button>
    </div>

    <div id="quiz-view" style="display:none">
      <span class="badge badge-blue">站點 2-2 — 分享時刻</span>
      <div class="info-box">
        📖 台灣少子化嚴重，很多時候是 60 幾歲的初老子女，在照顧 80、90 歲的超高齡父母，甚至有些是老伴互相照顧。體力上根本無法負荷抱起、洗澡、翻身等重度勞動。
      </div>
      <h1>很多老夫妻或初老子女覺得自己人照顧才孝順，就算腰酸背痛也硬撐。有什麼方式可以減緩這種問題？</h1>
      <label for="answer">你的想法</label>
      <textarea id="answer" placeholder="在這裡寫下你的想法…" maxlength="500"></textarea>
      <div class="char-count"><span id="char-now">0</span> / 500</div>
      <button id="submit-btn" disabled>送出回答</button>
    </div>

    <div class="success" id="success-view">
      <div class="success-icon">🎉</div>
      <h2>謝謝你的分享！</h2>
      <p>繼續加油，<br>前往下一個站點！</p>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhsz_9aVzOHkD2UxDShpEamyAY5PGDmx-NCDTr9l-5dF43FKtFcobzJ66b0yT9CC8e/exec";
    let playerName = "";

    const nameInput = document.getElementById("name");
    const startBtn = document.getElementById("start-btn");
    const answerInput = document.getElementById("answer");
    const submitBtn = document.getElementById("submit-btn");
    const charNow = document.getElementById("char-now");

    nameInput.addEventListener("input", function() {
      startBtn.disabled = this.value.trim().length === 0;
    });

    startBtn.addEventListener("click", function() {
      playerName = nameInput.value.trim();
      if (!playerName) return;
      document.getElementById("name-view").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";
    });

    answerInput.addEventListener("input", function() {
      charNow.textContent = this.value.length;
      submitBtn.disabled = this.value.trim().length === 0;
    });

    submitBtn.addEventListener("click", async function() {
      const answer = answerInput.value.trim();
      if (!answer) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "送出中…";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            station: "站點2-2",
            name: playerName,
            answer: answer
          })
        });
      } catch (err) {
        console.error(err);
      }

      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";
    });
  </script>
</body>
</html>
